<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chapelle du Viaulnay — Notre-Dame de Pitié</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Texture parchemin plein écran -->
  <div class="parchment" aria-hidden="true"></div>

  <!-- Triangle discret dans le coin haut-gauche : plein écran / quitter,
       visible sur tous les écrans (au-dessus du lightbox) -->
  <button id="btn-fullscreen" class="fullscreen-toggle" type="button" aria-label="Passer en plein écran" title="Plein écran">
    <svg class="fullscreen-icon fullscreen-icon-enter" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" />
    </svg>
    <svg class="fullscreen-icon fullscreen-icon-exit" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M9 4v5H4M15 9V4M15 9h5M4 15h5v5M15 20v-5h5" />
    </svg>
  </button>

  <!-- ═══════════════ ÉCRAN 1 · ACCUEIL ═══════════════ -->
  <section id="screen-home" class="screen is-active" aria-label="Accueil">
    <div class="home-frame">
      <div class="ornament ornament-top" aria-hidden="true">✦ ─── ✠ ─── ✦</div>
      <p class="eyebrow">Anno Domini · MDLX</p>
      <h1 class="home-title">
        Chapelle du Viaulnay<br />
        <span class="home-title-sub">Notre-Dame de Pitié</span>
      </h1>
      <p class="home-place">Loigné-sur-Mayenne</p>
      <div class="ornament ornament-mid" aria-hidden="true">❦</div>
      <button id="btn-start" class="btn btn-primary" type="button">Démarrer</button>
      <div class="ornament ornament-bottom" aria-hidden="true">✦ ─────────── ✦</div>
    </div>
  </section>

  <!-- ═══════════════ ÉCRAN 2 · INTRODUCTION ═══════════════
       Trois parties (data.js → intro[]) : titre + sous-titre en haut,
       puis une mosaïque de photos ; chaque photo s'ouvre en grand -->
  <section id="screen-intro" class="screen" aria-label="Introduction">
    <header class="gallery-header intro-header">
      <button id="btn-intro-home" class="btn btn-ghost" type="button">✠&nbsp; Accueil</button>
      <div class="intro-heading">
        <h2 class="gallery-title" id="intro-title"></h2>
        <p class="intro-subtitle" id="intro-subtitle"></p>
      </div>
      <div class="detail-nav">
        <button id="btn-intro-prev" class="btn btn-primary btn-arrow" type="button" aria-label="Partie précédente">←</button>
        <span class="detail-counter" id="intro-counter"></span>
        <button id="btn-intro-next" class="btn btn-primary btn-arrow" type="button" aria-label="Partie suivante">→</button>
      </div>
    </header>

    <div class="mosaic-viewport" id="mosaic-viewport">
      <div class="mosaic" id="mosaic"></div>
    </div>
  </section>

  <!-- Fenêtre d'agrandissement d'une photo de l'introduction -->
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Photo agrandie" hidden>
    <button id="lightbox-close" class="btn btn-secondary lightbox-close" type="button" aria-label="Fermer">✕</button>
    <button id="lightbox-prev" class="btn btn-primary btn-arrow lightbox-arrow lightbox-arrow-prev" type="button" aria-label="Photo précédente">←</button>
    <figure class="lightbox-figure">
      <img id="lightbox-img" src="" alt="" />
      <figcaption id="lightbox-counter"></figcaption>
    </figure>
    <button id="lightbox-next" class="btn btn-primary btn-arrow lightbox-arrow lightbox-arrow-next" type="button" aria-label="Photo suivante">→</button>
  </div>

  <!-- ═══════════════ ÉCRAN 3 · GALERIE ═══════════════ -->
  <section id="screen-gallery" class="screen" aria-label="Liste des fresques">
    <header class="gallery-header">
      <div class="gallery-actions">
        <button id="btn-home" class="btn btn-ghost" type="button">✠&nbsp; Accueil</button>
        <button id="btn-thanks" class="btn btn-ghost" type="button">✠&nbsp; Remerciement</button>
      </div>
      <h2 class="gallery-title">Les fresques de la chapelle</h2>

      <!-- Window component : bascule Versant Nord / Versant Sud -->
      <div class="segmented" role="tablist" aria-label="Choix du versant">
        <span class="segmented-thumb" aria-hidden="true"></span>
        <button class="segmented-btn is-active" type="button" role="tab" aria-selected="true" data-side="nord">
          Versant Nord
        </button>
        <button class="segmented-btn" type="button" role="tab" aria-selected="false" data-side="sud">
          Versant Sud
        </button>
      </div>
    </header>

    <div class="slider-viewport">
      <div class="slider-track" id="slider-track">
        <div class="slider-panel" role="tabpanel" aria-label="Fresques du versant nord">
          <div class="card-grid" id="grid-nord"></div>
        </div>
        <div class="slider-panel" role="tabpanel" aria-label="Fresques du versant sud">
          <div class="card-grid" id="grid-sud"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ═══════════════ ÉCRAN 4 · DÉTAIL ═══════════════ -->
  <section id="screen-detail" class="screen" aria-label="Détail d'une fresque">
    <header class="detail-header">
      <div class="detail-left">
        <button id="btn-back" class="btn btn-secondary" type="button">✠&nbsp; Retour</button>
        <!-- Commentaire audio de la fresque (data.js → son) : lancé
             automatiquement ; masqué si la fresque n'a pas de son -->
        <div class="detail-sound" id="detail-sound">
          <button id="btn-sound-replay" class="btn btn-secondary btn-icon" type="button" aria-label="Rejouer le son" title="Rejouer le son">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M3 4v6h6" />
              <path d="M3.5 15a9 9 0 1 0 2.1-9.4L3 10" />
            </svg>
          </button>
          <button id="btn-sound-mute" class="btn btn-secondary btn-icon btn-sound-mute" type="button" aria-label="Couper le son" title="Couper le son" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M11 5 6 9H2v6h4l5 4V5z" />
              <path class="sound-wave" d="M15.5 8.5a5 5 0 0 1 0 7" />
              <path class="sound-wave" d="M19 5a10 10 0 0 1 0 14" />
              <path class="sound-cross" d="m16 9 6 6M22 9l-6 6" />
            </svg>
          </button>
        </div>
      </div>
      <audio id="detail-audio" preload="auto"></audio>
      <div class="detail-heading">
        <h2 class="detail-title" id="detail-title">Titre de la fresque</h2>
        <p class="detail-subtitle" id="detail-subtitle"></p>
      </div>
      <div class="detail-nav">
        <button id="btn-prev" class="btn btn-primary btn-arrow" type="button" aria-label="Fresque précédente">←</button>
        <span class="detail-counter" id="detail-counter"></span>
        <button id="btn-next" class="btn btn-primary btn-arrow" type="button" aria-label="Fresque suivante">→</button>
      </div>
    </header>

    <div class="detail-images">
      <figure class="detail-figure">
        <img id="detail-img-left" src="" alt="" />
        <figcaption>État actuel</figcaption>
      </figure>
      <figure class="detail-figure">
        <img id="detail-img-right" src="" alt="" />
        <video id="detail-video-right" muted loop playsinline hidden></video>
        <figcaption>Restitution</figcaption>
      </figure>
      <div class="parchment-sheet-wrap detail-parchment-wrap">
        <div class="parchment-sheet">
          <p id="detail-description"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- ═══════════════ ÉCRAN 5 · CLÔTURE ═══════════════
       Après la dernière fresque du versant sud (data.js → outro) :
       deux photos au centre, la prière sur un parchemin en dessous -->
  <section id="screen-outro" class="screen" aria-label="Clôture">
    <header class="detail-header outro-header">
      <div class="detail-left">
        <button id="btn-outro-home" class="btn btn-secondary" type="button">✠&nbsp; Accueil</button>
      </div>
      <div class="detail-heading">
        <h2 class="detail-title" id="outro-title"></h2>
        <p class="detail-subtitle" id="outro-subtitle"></p>
      </div>
      <div class="detail-nav">
        <button id="btn-outro-prev" class="btn btn-primary btn-arrow" type="button" aria-label="Fresque précédente">←</button>
        <span class="detail-counter">Fin</span>
        <button class="btn btn-primary btn-arrow" type="button" aria-label="Fin du parcours" disabled>→</button>
      </div>
    </header>

    <div class="outro-body">
      <div class="outro-images" id="outro-images"></div>
      <div class="parchment-sheet-wrap outro-parchment-wrap">
        <div class="parchment-sheet">
          <div class="outro-text" id="outro-text"></div>
        </div>
      </div>
    </div>
  </section>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
